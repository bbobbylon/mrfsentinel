# Local dev stack: Postgres, Mailhog (catches magic-link emails so you can
# read them without a real inbox — see internal/auth/mailer.go), and the
# app itself, all built from the same Dockerfile. Compare to DeleteBoard's
# docker-compose.yml, which needs a 4th service (a separate nginx-served
# Angular frontend container) — this app doesn't, because the frontend is
# server-rendered Go templates baked into the same binary as the API. See
# ARCHITECTURE.md.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mrfsentinel
      POSTGRES_USER: mrfsentinel
      POSTGRES_PASSWORD: mrfsentinel_local_dev
    ports:
      - "5432:5432"
    volumes:
      - mrfsentinel-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mrfsentinel -d mrfsentinel"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog
    ports:
      - "1025:1025" # SMTP — this is what the app's SMTP_HOST/SMTP_PORT point at locally
      - "8025:8025" # web UI — open this in a browser to read magic-link emails

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      mailhog:
        condition: service_started
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://mrfsentinel:mrfsentinel_local_dev@postgres:5432/mrfsentinel?sslmode=disable"
      PUBLIC_BASE_URL: "http://localhost:8080"
      SMTP_HOST: "mailhog"
      SMTP_PORT: "1025"
      SMTP_FROM: "no-reply@mrfsentinel.local"
    ports:
      - "8080:8080"

volumes:
  mrfsentinel-postgres-data:
