{{define "title"}}Sign in · MRF Sentinel{{end}}
{{define "content"}}
<div class="card narrow">
  <h1>Sign in</h1>
  <p class="muted">No password — we'll email you a one-time link that signs you in for 14 days.</p>

  {{if .Error}}<p class="error">{{.Error}}</p>{{end}}

  <form method="post" action="/login">
    <label for="email">Work email</label>
    <input type="email" id="email" name="email" placeholder="you@hospital-system.org" required autofocus>
    <button type="submit">Email me a sign-in link</button>
  </form>
</div>
{{end}}
