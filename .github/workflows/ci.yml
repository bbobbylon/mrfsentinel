name: CI

# Runs on every push and PR — build, vet, and test the Go module, plus a
# real Postgres service container so internal/store's migrations can be
# applied for real, the same way they were verified locally during
# development (see README.md's verification table). Compare to
# DeleteBoard's ci.yml, which needs two separate jobs (backend + frontend)
# — this project only has one, because there's no separate frontend build.
on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only ever reads the repository. It pushes
# nothing and comments nowhere, so it has no reason to hold a writable
# token. Deployment lives in cd.yml, which asks for exactly what it needs.
permissions:
  contents: read

# Superseded runs on the same branch are pointless — only the newest commit's
# result matters for a merge decision. Cancelling them keeps the queue short
# and stops an older run from reporting a stale red after a fix is pushed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Pinned rather than `ubuntu-latest`: GitHub begins migrating that label to
    # Ubuntu 26 on 2026-10-19, and a major image change lands as a surprise red
    # run on whatever gets pushed that day. Bumping this is then a deliberate
    # one-line commit that can be reverted, instead of an image swap nobody
    # chose. Revisit once 26.04 has settled.
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mrfsentinel
          POSTGRES_USER: mrfsentinel
          POSTGRES_PASSWORD: mrfsentinel_local_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mrfsentinel -d mrfsentinel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      # go-version-file rather than a hardcoded "1.24": the toolchain is then
      # whatever go.mod itself requires (currently 1.24.7), so bumping the Go
      # version is a one-line change in go.mod instead of two edits that can
      # drift apart. setup-go pins GOTOOLCHAIN=local, so a runner Go older
      # than go.mod's requirement is a hard failure rather than a silent
      # download — which is exactly why these two should never disagree.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      # This step failed on the very first push to this repo: lib/pq was
      # marked "// indirect" in go.mod despite being imported directly (the
      # blank import in internal/store/db.go still counts as a direct
      # dependency), so `go mod tidy` rewrote the line and the diff check
      # tripped. Hence the explanatory message — a bare diff is a puzzle the
      # next person has to re-solve.
      - name: Verify go.mod/go.sum are tidy
        run: |
          go mod tidy
          if ! git diff --exit-code go.mod go.sum; then
            echo
            echo "::error::go.mod/go.sum are not tidy — run 'go mod tidy' locally and commit the result."
            echo "The diff above is exactly what 'go mod tidy' changed."
            echo "Common cause: a dependency marked '// indirect' that this module actually imports"
            echo "directly (a blank '_' import counts as direct)."
            exit 1
          fi

      - name: gofmt check
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "::error::The following files are not gofmt-formatted:"
            echo "$UNFORMATTED"
            echo "Run 'gofmt -w .' and commit the result."
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./... -v
        env:
          DATABASE_URL: postgres://mrfsentinel:mrfsentinel_local_dev@localhost:5432/mrfsentinel?sslmode=disable

      - name: Docker build
        run: docker build -t mrfsentinel:ci .
